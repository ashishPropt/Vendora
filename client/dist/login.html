<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendora ? Sign In</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .card{background:#1e293b;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .logo{text-align:center;margin-bottom:32px}
  .logo h1{font-size:28px;font-weight:800;color:#f8fafc;letter-spacing:-0.5px}
  .logo p{font-size:14px;color:#64748b;margin-top:4px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .field input{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:8px;padding:12px 14px;font-size:15px;color:#f8fafc;outline:none;transition:border-color .15s}
  .field input:focus{border-color:#2563eb}
  .field input::placeholder{color:#475569}
  .btn{width:100%;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:8px}
  .btn:hover{background:#1d4ed8}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .error{background:#7f1d1d;border:1px solid #dc2626;color:#fca5a5;border-radius:8px;padding:12px;font-size:13px;margin-bottom:16px;display:none}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>??? Vendora</h1>
    <p>Vendor Management Platform</p>
  </div>
  <div class="error" id="err"></div>
  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="????????" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn">Sign In</button>
  </form>
</div>
<script>
  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('btn');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in?';
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      const _redirect = new URLSearchParams(window.location.search).get('redirect');
      if (data.role === 'admin') {
        localStorage.setItem('vendora_admin_token', data.token);
        window.location.href = _redirect ? '/' + _redirect : '/dashboard.html';
      } else if (data.role === 'vendor') {
        localStorage.setItem('vendora_vendor_token', data.token);
        window.location.href = _redirect ? '/' + _redirect : '/vendor-portal.html';
      } else if (data.role === 'developer') {
        localStorage.setItem('dev_token', data.token);
        window.location.href = _redirect ? '/' + _redirect : '/developer.html';
      } else {
        throw new Error('Unknown account role');
      }
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
<div style="text-align:center;margin-top:32px">
  <a href="/developer.html" style="font-size:13px;color:#475569;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:8px 18px;display:inline-block;transition:color .15s" onmouseover="this.style.color='#f8fafc'" onmouseout="this.style.color='#475569'">
    🔌 Developer API &amp; Integration Docs
  </a>
</div>
</body>
</html>
